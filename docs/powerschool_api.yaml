openapi: 3.0.0
info:
  title: PowerSchool API - Students and Contacts
  version: 1.0.0
  description: >-
    Postman collection for PowerSchool API endpoints related to students and
    contact records.
servers:
  - url: '{{base_url}}'
paths:
  /oauth/access_token:
    parameters: []
    post:
      summary: Access Token
      tags:
        - token
      parameters:
        - name: Authorization
          in: header
          required: false
          example: Bearer {{access_token}}
          schema:
            deprecated: false
        - name: Content-Type
          in: header
          required: false
          example: application/json
          schema:
            deprecated: false
        - name: Accept
          in: header
          required: false
          example: application/json
          schema:
            deprecated: false
      responses:
        '200':
          headers:
            Content-Type:
              schema:
                deprecated: false
              example: application/json;charset=UTF-8
          description: Access Token
  /ws/v1/district/student:
    parameters: []
    get:
